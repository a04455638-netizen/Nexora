<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_nx-tv-97" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D0D11" />
      <stop offset="50%" stop-color="#141419" />
      <stop offset="100%" stop-color="#08080A" />
    </linearGradient>
    <radialGradient id="glow_nx-tv-97" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.20" />
      <stop offset="60%" stop-color="#3B82F6" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="cardGrad_nx-tv-97" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#181822" />

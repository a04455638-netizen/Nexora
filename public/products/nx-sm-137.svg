    <!-- Verified Authentic Seal -->
    <g transform="translate(300, 33)">
      <circle cx="0" cy="0" r="16" fill="#101016" stroke="#76B900" stroke-width="2"/>
      <path d="M-6 0 L-2 4 L6 -4" fill="none" stroke="#76B900" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

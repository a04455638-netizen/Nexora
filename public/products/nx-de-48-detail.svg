<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_nx-de-48" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D0D11" />
      <stop offset="50%" stop-color="#141419" />
      <stop offset="100%" stop-color="#08080A" />
    </linearGradient>
    <radialGradient id="glow_nx-de-48" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#76B900" stop-opacity="0.20" />
      <stop offset="60%" stop-color="#76B900" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#76B900" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="cardGrad_nx-de-48" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#181822" />
      <stop offset="100%" stop-color="#13131A" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="600" fill="url(#bg_nx-de-48)" />
  <circle cx="400" cy="245" r="280" fill="url(#glow_nx-de-48)" />

  <!-- Outer Protective Frame -->
  <rect x="20" y="20" width="760" height="560" rx="26" fill="none" stroke="#24242E" stroke-width="2" />
  <rect x="18" y="18" width="764" height="564" rx="27" fill="none" stroke="#76B900" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="14,10" />

  <!-- Top Header Info -->
  <g transform="translate(50, 60)">
    <!-- Brand Emblem -->
    <rect x="0" y="-16" width="110" height="30" rx="8" fill="#1C1C26" stroke="#333342" stroke-width="1.5" />
    <text x="55" y="4" text-anchor="middle" fill="#76B900" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="13" letter-spacing="2">
      HP
